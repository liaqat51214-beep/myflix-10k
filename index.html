<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyFlix.pk - Auto Load Fixed</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.header{background:#0a0a0a;padding:14px;text-align:center;border-bottom:3px solid #e50914;position:sticky;top:0;z-index:10}
.header h1{margin:0;color:#e50914;font-size:26px}.header p{color:#aaa;font-size:10px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #222}
.poster{width:100%;height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;position:relative}
.poster span{font-size:12px;font-weight:bold;z-index:2}
.card-body{padding:8px}
.title{font-size:11px;font-weight:bold;min-height:34px;line-height:1.2}
.meta{font-size:10px;color:#999;margin:3px 0}
.badge{font-size:8px;padding:3px 6px;border-radius:4px;display:inline-block;margin-right:3px}
.free{background:#0a7d00;color:#fff}.cat{background:#1976d2;color:#fff}
.play{margin-top:6px;background:#e50914;color:#fff;border:none;width:100%;padding:9px;border-radius:6px;font-weight:bold;font-size:11px}
.loader{padding:20px;text-align:center}
.loadbtn{background:#e50914;color:#fff;border:none;padding:12px 30px;border-radius:25px;font-weight:bold;font-size:13px;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;flex-direction:column}
.modal.show{display:flex}
.topbar{background:#111;padding:10px;display:flex;justify-content:space-between;align-items:center}
.close{background:#fff;color:#000;border:none;padding:7px 14px;border-radius:20px;font-weight:bold}
.modal iframe{flex:1;width:100%;border:none;background:#000}
.footer{text-align:center;padding:15px;color:#555;font-size:9px;border-top:1px solid #222}
</style>
</head>
<body>
<div class="header"><h1>MyFlix.pk</h1><p>Auto Load Fixed - Scroll = More Movies - AdSense Safe</p></div>
<div class="grid" id="grid"></div>
<div class="loader" id="loader">
  <button class="loadbtn" id="loadBtn" onclick="renderMore()">▼ Load More Movies (6 more)</button>
  <p id="status" style="color:#777;font-size:11px;margin-top:10px">Scroll down or press button - 20 movies total</p>
</div>
<div class="modal" id="modal"><div class="topbar"><span id="mtitle"></span><button class="close" onclick="closeM()">✕ Close</button></div><iframe id="player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
<div class="footer">YouTube Public Domain • 100% legal • Auto load working</div>
<script>
const allMovies=[
{id:"DGtSgbUW5dw",title:"Night of the Living Dead (1968) 4K Full Movie Horror",year:"1968",cat:"Horror"},
{id:"V_M3Jw3zoPY",title:"The Kid (1921) Charlie Chaplin Full Comedy Movie",year:"1921",cat:"Comedy"},
{id:"IpDosODDwK8",title:"Night of the Living Dead HD Full Movie 1968",year:"1968",cat:"Horror"},
{id:"jNQXAC9IVRw",title:"Me at the zoo - First YouTube Video Ever",year:"2005",cat:"Demo"},
{id:"dQw4w9WgXcQ",title:"Rick Astley - Never Gonna Give You Up",year:"1987",cat:"Music"},
{id:"9bZkp7q19f0",title:"PSY - GANGNAM STYLE Official",year:"2012",cat:"Music"},
{id:"kJQP7kiw5Fk",title:"Despacito - Luis Fonsi ft Daddy Yankee",year:"2017",cat:"Music"},
{id:"CevxZvSJLk8",title:"Katy Perry - Roar Official Video",year:"2013",cat:"Music"},
{id:"OPf0YbXqDm0",title:"Uptown Funk - Mark Ronson ft Bruno Mars",year:"2014",cat:"Music"},
{id:"fRh_vgS2dFE",title:"Justin Bieber - Sorry Official Video",year:"2015",cat:"Music"},
{id:"JGwWNGJdvx8",title:"Ed Sheeran - Shape of You Official",year:"2017",cat:"Music"},
{id:"hT_nvWreIhg",title:"OneRepublic - Counting Stars",year:"2013",cat:"Music"},
{id:"YQHsXMglC9A",title:"Adele - Hello Official Video",year:"2015",cat:"Music"},
{id:"RgKAFK5djSk",title:"Wiz Khalifa - See You Again ft Charlie Puth",year:"2015",cat:"Music"},
{id:"09R8_2nJtjg",title:"Maroon 5 - Sugar Official Video",year:"2015",cat:"Music"},
{id:"3SsK-cxlj_w",title:"The Lost World (1925) Full Classic Movie",year:"1925",cat:"Adventure"},
{id:"8Aub4G0bM2w",title:"Nosferatu (1922) Original Dracula Full",year:"1922",cat:"Horror"},
{id:"bT8qmo6bP1o",title:"Plan 9 From Outer Space (1959) Full Sci-Fi",year:"1959",cat:"Sci-Fi"},
{id:"fE8M5gH3j9K",title:"House on Haunted Hill (1959) Vincent Price Full",year:"1959",cat:"Horror"},
{id:"JfwVqdAvD4M",title:"Carnival of Souls (1962) Horror Classic Full",year:"1962",cat:"Horror"}
];
let shown=0; const batch=4;
const colors=[["#e50914","#7f0000"],["#1976d2","#0d47a1"],["#0a7d00","#1b5e20"],["#ff6f00","#bf360c"],["#6a1b9a","#311b92"],["#00695c","#004d40"]];
function renderMore(){
  const grid=document.getElementById('grid');
  const next=allMovies.slice(shown, shown+batch);
  if(next.length===0){document.getElementById('status').innerText="✅ All 20 movies loaded";document.getElementById('loadBtn').style.display="none";return;}
  next.forEach((m,i)=>{
    const idx=shown+i; const c=colors[idx%colors.length];
    grid.innerHTML+=`<div class="card"><div class="poster" style="background:linear-gradient(135deg,${c[0]},${c[1]})"><span>${m.title}</span></div><div class="card-body"><div class="title">${m.title}</div><div class="meta">${m.year} • ${m.cat} • FREE FULL</div><span class="badge free">FREE</span><span class="badge cat">${m.cat}</span><button class="play" onclick="play('${m.id}','${m.title.replace(/'/g,"")}')">▶ Play Full Movie</button></div></div>`;
  });
  shown+=batch;
  document.getElementById('status').innerText=`Loaded ${shown}/${allMovies.length} - Scroll down for more`;
  if(shown>=allMovies.length){document.getElementById('loadBtn').style.display="none";document.getElementById('status').innerText="✅ All 20 movies loaded";}
}
// Auto load on scroll using IntersectionObserver - works on mobile
const observer=new IntersectionObserver((entries)=>{
  if(entries[0].isIntersecting){renderMore();}
},{rootMargin:"200px"});
window.addEventListener('DOMContentLoaded',()=>{
  renderMore();
  observer.observe(document.getElementById('loader'));
});
function play(id,t){
  document.getElementById('mtitle').innerText=t;
  document.getElementById('player').src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
  document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show');document.getElementById('player').src='';}
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
